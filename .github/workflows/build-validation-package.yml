name: Build Harness validation package
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      node:
        required: true
        type: string
      upload-package:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Platform-default fixture initialization
        run: >-
          node --input-type=module -e "import {fixture} from './server/test-fixtures.mjs';
          const cleanups=[]; try { console.log(fixture({after:fn=>cleanups.push(fn)},{profile:true}).root); }
          finally { for(const fn of cleanups.reverse()) fn(); }"
      - name: Packaged release and installer checks
        env:
          GOLEM_TRACE_COMMANDS: '1'
        run: python tools/build-release.py --output "$RUNNER_TEMP/platform-release.zip"

      - uses: actions/upload-artifact@v7.0.2
        if: inputs.upload-package
        with:
          name: harness-validation-package
          path: ${{ runner.temp }}/platform-release.zip*
          if-no-files-found: error
