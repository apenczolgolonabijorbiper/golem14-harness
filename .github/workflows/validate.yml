name: Validate harness platforms
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: harness-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Select validation scope
        id: scope
        env:
          SCOPE_EVENT: ${{ github.event_name }}
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci/validation-scope.py

  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Repository-only explorer and CI routing checks
        run: |
          python tools/test-explorer.py
          python tools/ci/test-validation-scope.py
          python tools/build-explorer.py
          python tools/test-doc-contracts.py
          npm ci --prefix tools/explorer --ignore-scripts --no-audit --no-fund
          node tools/explorer/test-markdown.mjs

  validate:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Platform-default fixture initialization
        run: >-
          node --input-type=module -e "import {fixture} from './server/test-fixtures.mjs';
          const cleanups=[]; try { console.log(fixture({after:fn=>cleanups.push(fn)},{profile:true}).root); }
          finally { for(const fn of cleanups.reverse()) fn(); }"
      - name: Packaged release and installer checks
        env:
          GOLEM_TRACE_COMMANDS: '1'
        run: python tools/build-release.py --output ../platform-release.zip

  capacity:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Synthetic capacity measurements
        run: node tools/benchmark-capacity.mjs 500,2000,5000,10000 256
      - name: Larger note measurement
        run: node tools/benchmark-capacity.mjs 2000 2048
      - name: Small batch cycle measurements
        run: node tools/benchmark-cycle.mjs 5,10,20 3

  validation-result:
    if: always()
    needs: [changes, explorer, validate, capacity]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          CHANGES: ${{ needs.changes.result }}
          EXPLORER: ${{ needs.explorer.result }}
          VALIDATE: ${{ needs.validate.result }}
          CAPACITY: ${{ needs.capacity.result }}
          PLATFORMS: ${{ needs.changes.outputs.platforms }}
        run: |
          test "$CHANGES" = success
          test "$EXPLORER" = success
          if [ "$PLATFORMS" = true ]; then
            test "$VALIDATE" = success
            test "$CAPACITY" = success
          else
            test "$VALIDATE" = skipped
            test "$CAPACITY" = skipped
          fi
