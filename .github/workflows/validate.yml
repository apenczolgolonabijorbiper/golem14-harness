name: Validate harness platforms
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: harness-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Select validation scope
        id: scope
        env:
          SCOPE_EVENT: ${{ github.event_name }}
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci/validation-scope.py

  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Core specification parity and retained conformance
        env:
          PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$PARITY_BASE" ] && [ "$PARITY_BASE" != 0000000000000000000000000000000000000000 ]; then
            python tools/portability/check-parity.py --base "$PARITY_BASE"
          else
            python tools/portability/check-parity.py
          fi
          python tools/portability/test-parity.py
          node tools/portability/conformance.mjs
          node --test tools/portability/scenarios.test.mjs
          node tools/portability/conformance.mjs --command '["perl","portability/examples/stats.pl"]' --operations stats

  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Repository-only explorer and CI routing checks
        run: |
          python tools/test-explorer.py
          python tools/ci/test-validation-scope.py
          python tools/build-explorer.py
          python tools/test-doc-contracts.py
          npm ci --prefix tools/explorer --ignore-scripts --no-audit --no-fund
          node tools/explorer/test-markdown.mjs

  package:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    uses: ./.github/workflows/build-validation-package.yml
    with:
      os: ubuntu-latest
      node: '24'
      upload-package: true

  validate:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
          - os: macos-latest
            node: '24'
    uses: ./.github/workflows/build-validation-package.yml
    with:
      os: ${{ matrix.os }}
      node: ${{ matrix.node }}

  windows:
    needs: package
    uses: ./.github/workflows/windows-package.yml
    with:
      artifact: harness-validation-package

  capacity:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Synthetic capacity measurements
        run: node tools/benchmark-capacity.mjs 500,2000,5000,10000 256
      - name: Larger note measurement
        run: node tools/benchmark-capacity.mjs 2000 2048
      - name: Small batch cycle measurements
        run: node tools/benchmark-cycle.mjs 5,10,20 3

  validation-result:
    if: always()
    needs: [changes, explorer, portability, package, validate, windows, capacity]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          CHANGES: ${{ needs.changes.result }}
          EXPLORER: ${{ needs.explorer.result }}
          PORTABILITY: ${{ needs.portability.result }}
          PACKAGE: ${{ needs.package.result }}
          VALIDATE: ${{ needs.validate.result }}
          WINDOWS: ${{ needs.windows.result }}
          CAPACITY: ${{ needs.capacity.result }}
          PLATFORMS: ${{ needs.changes.outputs.platforms }}
        run: |
          test "$CHANGES" = success
          test "$EXPLORER" = success
          test "$PORTABILITY" = success
          if [ "$PLATFORMS" = true ]; then
            test "$PACKAGE" = success
            test "$VALIDATE" = success
            test "$WINDOWS" = success
            test "$CAPACITY" = success
          else
            test "$PACKAGE" = skipped
            test "$VALIDATE" = skipped
            test "$WINDOWS" = skipped
            test "$CAPACITY" = skipped
          fi
