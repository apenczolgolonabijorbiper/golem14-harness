name: Harness Windows reliability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/subprocess.mjs
      - server/subprocess.test.mjs
      - tools/benchmark-capacity.mjs
      - tools/benchmark-cycle.mjs
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Full Windows distribution checks
        env:
          GOLEM_TRACE_COMMANDS: '1'
        run: python tools/build-release.py --output "$env:RUNNER_TEMP/platform-release.zip"
      - name: Windows capacity and batch measurements
        if: matrix.python == '3.12'
        run: |
          node tools/benchmark-capacity.mjs 500,2000,5000,10000 256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/benchmark-capacity.mjs 2000 2048
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/benchmark-cycle.mjs 5,10,20 3
