name: Check Windows package
on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: release-package
      - name: Verify and exercise the Linux-built package on Windows
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: python tools/ci/check-windows-package.py release-package --node-version "$env:NODE_VERSION"
