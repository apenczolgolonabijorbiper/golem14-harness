name: Publish harness release
on:
  push:
    branches: [master]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: harness-release-master
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="golem-cognitive-harness-${version}.zip"
          python3 tools/build-release.py --output "$archive"
          sha256sum -c "$archive.sha256"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          gh release create "v$version" "$archive" "$archive.sha256" \
            --target "$GITHUB_SHA" --title "Golem XIV Harness $version" \
            --notes-file docs/PROVENANCE.md
