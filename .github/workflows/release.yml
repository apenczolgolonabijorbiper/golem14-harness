name: Publish harness release
on:
  push:
    branches: [master]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - tools/build-explorer.py
      - tools/explorer/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: harness-release-master
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Generate and check architecture explorer
        run: |
          python3 tools/build-explorer.py
          python3 tools/test-explorer.py
      - name: Retain downloadable explorer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golem-harness-architecture-explorer
          path: docs/architecture-explorer.html
          if-no-files-found: error
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="golem-cognitive-harness-${version}.zip"
          python3 tools/build-release.py --output "$archive"
          sha256sum -c "$archive.sha256"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          gh release create "v$version" "$archive" "$archive.sha256" \
            --target "$GITHUB_SHA" --title "Golem XIV Harness $version" \
            --notes-file docs/RELEASE_NOTES.md
      - name: Save explorer in repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 tools/explorer/persist.py --expected-head "$GITHUB_SHA"
