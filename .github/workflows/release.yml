name: Publish harness release
on:
  push:
    branches: [master]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - tools/build-explorer.py
      - tools/explorer/**
  workflow_dispatch:

permissions:
  contents: read

concurrency: harness-release-master

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Generate and check architecture explorer
        run: |
          python3 tools/build-explorer.py
          python3 tools/test-explorer.py
      - name: Retain downloadable explorer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golem-harness-architecture-explorer
          path: docs/architecture-explorer.html
          if-no-files-found: error
      - name: Build the validated release
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="golem-cognitive-harness-${version}.zip"
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$previous" ]; then
            python3 tools/portability/check-parity.py --base "$previous"
          else
            python3 tools/portability/check-parity.py
          fi
          python3 tools/build-release.py --output "$archive"
          sha256sum -c "$archive.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: harness-release-package
          path: golem-cognitive-harness-*.zip*
          if-no-files-found: error

  windows:
    needs: build
    uses: ./.github/workflows/windows-package.yml
    with:
      artifact: harness-release-package

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: harness-release-package
      - uses: actions/download-artifact@v8.0.2
        with:
          name: golem-harness-architecture-explorer
          path: docs
      - name: Publish the tested archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          archive="golem-cognitive-harness-${version}.zip"
          sha256sum -c "$archive.sha256"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          gh release create "v$version" "$archive" "$archive.sha256" \
            --target "$GITHUB_SHA" --title "Golem XIV Harness $version" \
            --notes-file docs/RELEASE_NOTES.md
      - name: Save explorer in repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 tools/explorer/persist.py --expected-head "$GITHUB_SHA"
